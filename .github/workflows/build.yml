name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore BlackNotepad.sln

      - name: Build
        run: msbuild BlackNotepad.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackNotepad
          path: src/bin/Release/

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore BlackNotepad.sln

      - name: Build Release
        run: msbuild BlackNotepad.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Create portable zip
        run: |
          Compress-Archive -Path src/bin/Release/* -DestinationPath BlackNotepad-Portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BlackNotepad-Portable.zip
          generate_release_notes: true
