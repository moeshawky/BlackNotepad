name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore BlackNotepad.sln

      - name: Build Release
        run: msbuild BlackNotepad.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false

      - name: Run Unit & ViewModel Tests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find **\vstest.console.exe | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found" }
          & $vstest BlackNotepad.Test\bin\Release\BlackNotepad.Test.dll /TestCaseFilter:"TestCategory!=UI"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BlackNotepad-Setup
          path: BlackNotepad-Setup-*.exe

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlackNotepad-Setup

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BlackNotepad-Setup-*.exe
          generate_release_notes: true
